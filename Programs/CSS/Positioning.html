<!DOCTYPE html> 
<html> 
<head> 
 <style>

.box1 {
  position: absolute;
  top: 0;
  left: 0;
  width: 100px;
  height: 100px;
  background: red;
  z-index: 1
}

.box2 { 
  position: relative;
  width: 100px;
  height: 100px;
  background: blue;
  z-index: 2;
  margin-top: 30px;
  margin-left: 30px;
}

 </style>
</head> 
<body> 
<div class="box1">Box 1</div>
<div class="box2">Box 2</div>
</body> 
</html>
