<!DOCTYPE html>
<html lang="en">
<head>
<style>

.btn:hover {
  transform: translateY(-15px); /* move button up */
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
</style>
</head>
<body>

<div>
  <button class="btn">Hover Me</button>
  <button class="animate-btn">Bounce</button>

</div>

</body>
</html>
